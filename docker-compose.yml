version: "3.9"

services:
  dashboard:
    build: .
    container_name: homelab-dashboard
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - ./data:/app/data            # SQLite database (moved out of Python package)
      - ./icons:/app/uploads/icons  # Uploaded icons
    environment:
      - DATABASE_PATH=/app/data/homelab.db
    networks:
      - homelab

networks:
  homelab:
    driver: bridge
